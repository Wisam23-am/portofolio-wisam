<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="avatar-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  
  <circle cx="200" cy="200" r="190" fill="url(#avatar-grad)" />
  <circle cx="200" cy="200" r="180" fill="url(#avatar-circle)" />
  
  <!-- Developer Silhouette / Tech Avatar with Terminal icon & code brackets -->
  <circle cx="200" cy="145" r="55" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="3" />
  <circle cx="200" cy="135" r="35" fill="#60a5fa" />
  <path d="M 115 300 C 115 225, 285 225, 285 300 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />

  <!-- Code symbol badge on avatar -->
  <rect x="140" y="270" width="120" height="40" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
  <text x="200" y="296" text-anchor="middle" fill="#10b981" font-family="monospace" font-weight="bold" font-size="16">&lt;WISAM /&gt;</text>
</svg>
