  <text x="400" y="390" fill="#fda4af" font-family="sans-serif" font-size="18" text-anchor="middle">taberu • to eat (Verb - Group 2)</text>

  <rect x="180" y="490" width="210" height="50" rx="8" fill="#10b981" opacity="0.9" />
  <text x="285" y="522" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">✓ Sudah Hafal</text>
