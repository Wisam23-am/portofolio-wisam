    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bk-bg)" />
  <rect x="80" y="60" width="1040" height="580" rx="16" fill="#09090b" stroke="#f43f5e" stroke-width="1.5" />
