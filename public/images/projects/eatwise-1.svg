<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="ew-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#ew-bg)" />
  <rect x="80" y="60" width="1040" height="580" rx="16" fill="#022c22" stroke="#10b981" stroke-width="1.5" />
  <circle cx="115" cy="90" r="6" fill="#ef4444" />
  <circle cx="135" cy="90" r="6" fill="#f59e0b" />
  <circle cx="155" cy="90" r="6" fill="#10b981" />
  <text x="190" y="95" fill="#a7f3d0" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">🥗 EatWise — AI Smart Food &amp; Nutrition Analyzer (Gemini Flash + Open Food Facts)</text>

  <!-- Left: Food Image Scan Viewport -->
  <rect x="130" y="140" width="480" height="460" rx="16" fill="#064e3b" stroke="#047857" />
  <rect x="160" y="170" width="420" height="280" rx="12" fill="#022c22" stroke="#10b981" stroke-width="1" stroke-dasharray="8,8" />
  <circle cx="370" cy="310" r="70" fill="#059669" opacity="0.3" />
  <text x="370" y="300" fill="#6ee7b7" font-family="system-ui, sans-serif" font-weight="bold" font-size="36" text-anchor="middle">🥑</text>
  <text x="370" y="335" fill="#a7f3d0" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="middle">Avocado Toast with Egg</text>
  <text x="370" y="355" fill="#6ee7b7" font-family="monospace" font-size="11" text-anchor="middle">Confidence: 98.4% • Gemini Flash Vision</text>

  <rect x="160" y="480" width="420" height="90" rx="10" fill="#022c22" />
  <text x="180" y="515" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">AI Health Assessment</text>
  <text x="180" y="540" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">Kaya asam lemak omega-3, protein tinggi, dan rendah gula tambahan.</text>

  <!-- Right: Nutritional Breakdown Card -->
  <rect x="640" y="140" width="420" height="460" rx="16" fill="#064e3b" stroke="#047857" />
  <text x="670" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="18">Nutritional Facts (Per Serving)</text>
  <text x="670" y="210" fill="#6ee7b7" font-family="monospace" font-size="12">Source: Open Food Facts API + AI Parsing</text>

  <!-- Calorie Big Card -->
  <rect x="670" y="235" width="360" height="70" rx="10" fill="#022c22" stroke="#10b981" />
  <text x="700" y="278" fill="#10b981" font-family="system-ui, sans-serif" font-weight="bold" font-size="32">340</text>
  <text x="770" y="265" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">Total Calories (kcal)</text>
  <text x="770" y="285" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">17% of Daily Recommended Value</text>

  <!-- Macros Grid -->
  <rect x="670" y="325" width="110" height="100" rx="10" fill="#022c22" />
  <text x="725" y="360" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Carbs</text>
  <text x="725" y="395" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">24g</text>

  <rect x="795" y="325" width="110" height="100" rx="10" fill="#022c22" />
  <text x="850" y="360" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Protein</text>
  <text x="850" y="395" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">14g</text>

  <rect x="920" y="325" width="110" height="100" rx="10" fill="#022c22" />
  <text x="975" y="360" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Fats</text>
  <text x="975" y="395" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">22g</text>

  <!-- Micro Pills -->
  <rect x="670" y="445" width="360" height="120" rx="10" fill="#022c22" />
  <text x="690" y="480" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Serat Pangan: 7g (28% DV)</text>
  <text x="690" y="510" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Natrium / Sodium: 210mg</text>
  <text x="690" y="540" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">• Gula / Sugar: 2g (Rendah)</text>
</svg>
