<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="do-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#do-bg)" />
  <rect x="80" y="60" width="1040" height="580" rx="16" fill="#042f2e" stroke="#0d9488" stroke-width="1.5" />
  <circle cx="115" cy="90" r="6" fill="#ef4444" />
  <circle cx="135" cy="90" r="6" fill="#f59e0b" />
  <circle cx="155" cy="90" r="6" fill="#10b981" />
  <text x="190" y="95" fill="#5eead4" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">🌴 DayOff — Enterprise Leave Management &amp; Team Calendar Platform (Mobile &amp; Web)</text>

  <!-- Left: Mobile Shell Mockup -->
  <rect x="130" y="140" width="280" height="460" rx="20" fill="#0f172a" stroke="#14b8a6" stroke-width="1.5" />
  <rect x="150" y="170" width="240" height="70" rx="10" fill="#1e293b" />
  <text x="165" y="195" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Sisa Cuti Tahunan: 10 Hari</text>
  <text x="165" y="215" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Dari total kuota 12 hari • Exp: Des 2026</text>

  <rect x="150" y="255" width="240" height="85" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
  <text x="165" y="280" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="12">Pengajuan Cuti Menikah</text>
  <text x="165" y="298" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">10 Okt 2026 - 13 Okt 2026 (4 Hari)</text>
  <rect x="165" y="310" width="80" height="18" rx="4" fill="#f59e0b" />
  <text x="205" y="323" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="9" text-anchor="middle">MENUNGGU</text>

  <!-- Right: Team Calendar Timeline Web/Dashboard -->
  <rect x="440" y="140" width="640" height="460" rx="16" fill="#0f172a" stroke="#334155" />
  <text x="470" y="180" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="bold" font-size="16">Team Calendar Timeline (Dual-Axis Sync)</text>
  
  <rect x="470" y="210" width="580" height="40" rx="6" fill="#1e293b" />
  <text x="490" y="235" fill="#94a3b8" font-family="monospace" font-size="11">Anggota Tim       | 01 | 02 | 03 | 04 | 05 | 06 | 07 | 08 | 09 | 10 | 11 |</text>

  <rect x="470" y="260" width="580" height="45" rx="6" fill="#0f172a" />
  <text x="490" y="288" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Budi Santoso</text>
  <rect x="650" y="268" width="160" height="28" rx="6" fill="#14b8a6" />
  <text x="730" y="286" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Cuti Tahunan (3 Hari)</text>

  <rect x="470" y="315" width="580" height="45" rx="6" fill="#0f172a" />
  <text x="490" y="343" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12">Siti Rahma</text>
  <rect x="760" y="323" width="130" height="28" rx="6" fill="#f43f5e" />
  <text x="825" y="341" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="bold" font-size="10" text-anchor="middle">Cuti Sakit</text>

  <!-- Multi approval step banner -->
  <rect x="470" y="380" width="580" height="190" rx="10" fill="#1e293b" stroke="#0d9488" stroke-width="1" />
  <text x="490" y="415" fill="#5eead4" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">Multi-Level Approval Flow: Level 1 (Manager) → Level 2 (HR)</text>
  <text x="490" y="445" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">✓ Proteksi Action Lock: Mencegah manajer menyetujui pengajuan berulang.</text>
  <text x="490" y="475" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">✓ Push Notification Cold-Start: Routing instan ke detail cuti via FCM.</text>
  <text x="490" y="505" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">✓ Ekosistem Terpadu: Flutter Melos Monorepo + React 19 Vite + ASP.NET Core.</text>
